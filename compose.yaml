x-app-environment: &app-environment
  MEMORY_BANK_MODE: production
  MEMORY_BANK_DATA_DIR: /data
  DATABASE_URL: postgresql+psycopg://memory_bank:memory_bank@postgres:5432/memory_bank
  MEMORY_BANK_DATABASE_URL: postgresql+psycopg://memory_bank:memory_bank@postgres:5432/memory_bank
  JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置至少 32 字节的 JWT_SECRET}
  AUTH_REQUIRED: "true"

services:
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment: *app-environment
    ports:
      - "8765:8765"
    volumes:
      - memory_data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "worker.py"]
    environment: *app-environment
    volumes:
      - memory_data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: memory_bank
      POSTGRES_USER: memory_bank
      POSTGRES_PASSWORD: memory_bank
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory_bank -d memory_bank"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  memory_data:
  postgres_data:
