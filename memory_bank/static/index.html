<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>记忆银行 · Memory Bank</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%2316324a'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='34' fill='white'%3E%E8%AE%B0%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <header class="topbar">
      <a class="brand" href="/" aria-label="记忆银行首页">
        <span class="brand-mark">记</span>
        <span><strong>记忆银行</strong><small>MEMORY BANK</small></span>
      </a>
      <div class="system-status"><span id="healthDot" class="status-dot"></span><span id="healthText">正在连接</span></div>
    </header>

    <main class="shell">
      <section class="hero">
        <div>
          <p class="eyebrow">可验证的人生故事工作台</p>
          <h1>把口述记忆，变成<br /><em>有证据的家庭故事。</em></h1>
          <p class="hero-copy">AI 负责追问、整理与表达；原声、确认、权限和最终决定始终掌握在家人手中。</p>
        </div>
        <div class="hero-proof">
          <div><b>01</b><span>逐轮采访</span></div>
          <div><b>02</b><span>证据绑定</span></div>
          <div><b>03</b><span>人工确认</span></div>
        </div>
      </section>

      <section id="setupCard" class="card setup-card">
        <div class="card-heading">
          <div><span class="kicker">NEW MEMORY</span><h2>开启一段记忆</h2></div>
          <span class="privacy-badge">本地演示 · 可随时撤回</span>
        </div>
        <form id="projectForm" class="setup-grid">
          <label>讲述人<input name="subject_name" value="外婆" required maxlength="60" /></label>
          <label>记忆主题<input name="topic" value="童年的夏天" required maxlength="120" /></label>
          <label>授权确认人<input name="consent_by" value="外婆本人" required maxlength="60" /></label>
          <label>采访轮数<select name="max_rounds"><option value="2">2 轮快速演示</option><option value="3" selected>3 轮完整演示</option><option value="4">4 轮深入采访</option></select></label>
          <button class="primary wide" type="submit">确认授权并开始采访 <span>→</span></button>
        </form>
      </section>

      <section id="workspace" class="workspace hidden">
        <nav class="stage-track" aria-label="流程进度">
          <div data-stage="interview"><i>1</i><span>采访</span></div>
          <div data-stage="evidence"><i>2</i><span>证据</span></div>
          <div data-stage="writing"><i>3</i><span>写作</span></div>
          <div data-stage="review"><i>4</i><span>确认</span></div>
          <div data-stage="delivered"><i>5</i><span>交付</span></div>
        </nav>

        <div class="workspace-grid">
          <section class="main-panel">
            <div id="stageContent"></div>
          </section>
          <aside class="side-panel">
            <div class="side-header"><span>证据与轨迹</span><button id="refreshButton" class="text-button">刷新</button></div>
            <div id="evidencePanel"></div>
            <div id="tracePanel"></div>
          </aside>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" role="status"></div>
    <script src="/static/app.js" defer></script>
  </body>
</html>
