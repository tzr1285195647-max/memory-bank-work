<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
<rect width="390" height="844" fill="#F6F2E9"/>
<rect x="0.0" y="0.0" width="390.0" height="92.0" rx="0" fill="#4E6657"/>
<rect x="24.0" y="250.0" width="342.0" height="220.0" rx="28" fill="#E0E8D8"/>
<rect x="24.0" y="650.0" width="342.0" height="52.0" rx="16" fill="#4E6657"/>
<text font-family="Noto Serif SC, Source Han Serif SC, SimSun, serif" font-size="24" font-weight="700" fill="#FFFFFF" xml:space="preserve"><tspan x="24.0" y="48.3">记忆银行</tspan></text>
<text font-family="Noto Serif SC, Source Han Serif SC, SimSun, serif" font-size="25" fill="#FFFFFF" xml:space="preserve"><tspan x="345.0" y="47.1">⋯</tspan></text>
<text font-family="Noto Serif SC, Source Han Serif SC, SimSun, serif" font-size="30" font-weight="700" fill="#26312B" xml:space="preserve"><tspan x="24.0" y="152.0">把家里的故事，慢慢留下来</tspan><tspan x="24.0" y="190.0"></tspan></text>
<text font-family="Noto Serif SC, Source Han Serif SC, SimSun, serif" font-size="16" fill="#747A73" xml:space="preserve"><tspan x="24.0" y="181.9">每一次讲述，都是给家人留的一盏灯。</tspan></text>
<text font-family="Noto Serif SC, Source Han Serif SC, SimSun, serif" font-size="72" font-weight="700" fill="#C98362" xml:space="preserve"><tspan x="54.0" y="346.4">“</tspan></text>
<text font-family="Noto Serif SC, Source Han Serif SC, SimSun, serif" font-size="30" font-weight="700" fill="#4E6657" xml:space="preserve"><tspan x="54.0" y="384.0">那些被时间</tspan><tspan x="54.0" y="422.0">温柔保存的声音</tspan></text>
<text font-family="Noto Serif SC, Source Han Serif SC, SimSun, serif" font-size="26" font-weight="700" fill="#4E6657" xml:space="preserve"><tspan x="24.0" y="556.0">记忆银行</tspan></text>
<text font-family="Noto Serif SC, Source Han Serif SC, SimSun, serif" font-size="16" fill="#747A73" xml:space="preserve"><tspan x="24.0" y="587.9">让长辈轻松讲，让家人一起听。</tspan></text>
<text font-family="Noto Serif SC, Source Han Serif SC, SimSun, serif" font-size="17" font-weight="700" fill="#FFFFFF" xml:space="preserve"><tspan x="62.0" y="681.2">我是长辈，开始讲述</tspan></text>
</svg>