<rect x="0.0" y="0.0" width="390.0" height="92.0" rx="0" fill="#4E6657"/>
<rect x="24.0" y="220.0" width="342.0" height="310.0" rx="20" fill="#FFFFFF"/>
<rect x="24.0" y="660.0" width="342.0" height="52.0" rx="16" fill="#4E6657"/>
<text font-family="Noto Serif SC, Source Han Serif SC, SimSun, serif" font-size="24" font-weight="700" fill="#FFFFFF" xml:space="preserve"><tspan x="24.0" y="48.3">记忆银行</tspan></text>
<text font-family="Noto Serif SC, Source Han Serif SC, SimSun, serif" font-size="30" font-weight="700" fill="#4E6657" xml:space="preserve"><tspan x="24.0" y="132.0">‹</tspan></text>
<text font-family="Noto Serif SC, Source Han Serif SC, SimSun, serif" font-size="25" font-weight="700" fill="#26312B" xml:space="preserve"><tspan x="58.0" y="135.1">故事预览</tspan></text>
<text font-family="Noto Serif SC, Source Han Serif SC, SimSun, serif" font-size="15" fill="#747A73" xml:space="preserve"><tspan x="24.0" y="179.0">确认后，这段故事会保存到你的故事书。</tspan></text>
<text font-family="Noto Serif SC, Source Han Serif SC, SimSun, serif" font-size="25" font-weight="700" fill="#26312B" xml:space="preserve"><tspan x="48.0" y="275.1">外婆的桂花树</tspan></text>
<text font-family="Noto Serif SC, Source Han Serif SC, SimSun, serif" font-size="17" fill="#747A73" xml:space="preserve"><tspan x="48.0" y="321.2">那年秋天，院子里的桂花开得很早。</tspan><tspan x="48.0" y="343.2">我和妹妹每天放学，都要绕路去看一眼。</tspan><tspan x="48.0" y="365.2">风一吹，整条巷子都是甜的。</tspan><tspan x="48.0" y="387.2"></tspan></text>
<text font-family="Noto Serif SC, Source Han Serif SC, SimSun, serif" font-size="13" font-weight="700" fill="#C98362" xml:space="preserve"><tspan x="48.0" y="485.3">原声 03:42     自然整理</tspan></text>
<text font-family="Noto Serif SC, Source Han Serif SC, SimSun, serif" font-size="15" fill="#747A73" xml:space="preserve"><tspan x="24.0" y="587.0">这段文字来自你的讲述，</tspan><tspan x="24.0" y="606.0">你可以继续修改或确认。</tspan></text>
<text font-family="Noto Serif SC, Source Han Serif SC, SimSun, serif" font-size="17" font-weight="700" fill="#FFFFFF" xml:space="preserve"><tspan x="158.0" y="691.2">确认故事</tspan></text>
</svg>